<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockfish 19 Chess</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>Stockfish 19 Chess</h1>
      <span class="badge" id="engineBadge">Stockfish 19 UCI Ready</span>
    </div>
  </header>

  <main class="main-container">
    <div class="game-area">
      <!-- Evaluation Bar -->
      <div class="eval-container" id="evalContainer" title="Position Evaluation">
        <div class="eval-score top" id="evalScoreTop">0.0</div>
        <div class="eval-black" id="evalBlack" style="height: 50%;"></div>
        <div class="eval-white" id="evalWhite"></div>
        <div class="eval-score bottom" id="evalScoreBottom">0.0</div>
      </div>

      <!-- Chessboard & Player Info -->
      <div class="board-container">
        <div class="player-info" id="topPlayerInfo">
          <div class="player-name">
            <span class="player-indicator black" id="topIndicator"></span>
            <span id="topPlayerName">Stockfish 19</span>
          </div>
          <div class="engine-status" id="topPlayerStatus">Idle</div>
        </div>

        <div class="board-wrapper">
          <div id="board"></div>

          <!-- Promotion Modal -->
          <div class="promotion-overlay hidden" id="promotionOverlay">
            <div class="promotion-dialog">
              <h3>Choose promotion piece</h3>
              <div class="promotion-choices" id="promotionChoices">
                <button class="promotion-choice" data-piece="q" title="Queen">&#9813;</button>
                <button class="promotion-choice" data-piece="r" title="Rook">&#9814;</button>
                <button class="promotion-choice" data-piece="b" title="Bishop">&#9815;</button>
                <button class="promotion-choice" data-piece="n" title="Knight">&#9816;</button>
              </div>
            </div>
          </div>
        </div>

        <div class="player-info" id="bottomPlayerInfo">
          <div class="player-name">
            <span class="player-indicator white" id="bottomIndicator"></span>
            <span id="bottomPlayerName">You (White)</span>
          </div>
          <div class="engine-status" id="bottomPlayerStatus">Your turn</div>
        </div>
      </div>
    </div>

    <!-- Sidebar Controls & Moves -->
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Game Status</div>
        <div class="status-box" id="statusBox">White to move</div>

        <div class="form-group">
          <label for="difficultySelect">Stockfish Difficulty</label>
          <select id="difficultySelect">
            <option value="1">Level 1: Beginner (~1320 Elo)</option>
            <option value="2">Level 2: Casual (~1600 Elo)</option>
            <option value="3" selected>Level 3: Intermediate (~1900 Elo)</option>
            <option value="4">Level 4: Master (~2300 Elo)</option>
            <option value="5">Level 5: Maximum (Stockfish 19 full strength)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="colorSelect">Play As</label>
          <select id="colorSelect">
            <option value="white" selected>White</option>
            <option value="black">Black</option>
            <option value="random">Random</option>
          </select>
        </div>

        <div class="btn-group">
          <button class="primary" id="btnNewGame">New Game</button>
          <button id="btnFlip">Flip Board</button>
          <button id="btnUndo">Takeback</button>
          <button id="btnEval">Update Eval</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Move History</div>
        <div class="history-container" id="historyContainer">
          <table class="history-table">
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>
    </aside>
  </main>

  <script type="module" src="/bundle.js"></script>
</body>
</html>
